<style>
  /* Metallic Light-Sweep (Bling) Effect */
  @keyframes blingSweep {
    0% { transform: translateX(-150%) skewX(-25deg); }
    25%, 100% { transform: translateX(250%) skewX(-25deg); }
  }

  /* Fast Light Flash Animation */
  @keyframes fastFlash {
    0%, 100% { opacity: 1; filter: brightness(1.2); }
    50% { opacity: 0.1; filter: brightness(0.5); }
  }

  .bling-card {
    position: relative;
    overflow: hidden;
  }

  .bling-card::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      60deg,
      transparent 30%,
      rgba(255, 255, 255, 0.3) 50%,
      rgba(245, 158, 11, 0.5) 55%,
      transparent 70%
    );
    animation: blingSweep 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }

  /* Staggered Bling Timing */
  .bling-card:nth-child(2n)::after { animation-delay: 0.3s; }
  .bling-card:nth-child(3n)::after { animation-delay: 0.6s; }
  .bling-card:nth-child(4n)::after { animation-delay: 0.9s; }

  .flash-active {
    animation: fastFlash 0.25s ease-in-out;
  }
</style>

<!-- SUPER FAST LOGO SWAP SCRIPT -->
<script>
  const logosList = [
    { src: "https://abdullah-gull.github.io/images/Amazon-Seller-Service-1024x500.png", title: "Amazon Seller Central" },
    { src: "https://abdullah-gull.github.io/images/Shopify-Logo.jpg", title: "Shopify" },
    { src: "https://abdullah-gull.github.io/images/walmart-logo-png-5.png", title: "Walmart" },
    { src: "https://abdullah-gull.github.io/images/Etsy_logo.svg.webp", title: "Etsy" },
    { src: "https://abdullah-gull.github.io/images/EBay_logo.png", title: "eBay" },
    { src: "https://abdullah-gull.github.io/images/6752c0a021fd1f672842c767_CPSecEh24I1i34_8eYced5Ig3NFthwrRw6bQQOMHdOg.png", title: "Helium 10" },
    { src: "https://abdullah-gull.github.io/images/images.jpg", title: "Amazon Vendor Central" },
    { src: "https://abdullah-gull.github.io/images/meta-facebook-rebranding-name-news_dezeen_2364_col_hero2.jpg", title: "Meta Ads" },
    { src: "https://abdullah-gull.github.io/images/jungle-scout-affiliate-program.jpg", title: "Jungle Scout" },
    { src: "https://abdullah-gull.github.io/images/OG_image_Squid_Ink.png", title: "Amazon Ads" }
  ];

  const gridContainer = document.getElementById('logo-grid-container');
  const cardCount = 12;

  // Initialize Black Cards Grid
  function initGrid() {
    gridContainer.innerHTML = '';
    for (let i = 0; i < cardCount; i++) {
      const logo = logosList[i % logosList.length];
      const cardHTML = `
        <div id="card-${i}" class="bling-card group relative bg-[#0a0a0a] border border-neutral-800 hover:border-amber-400/80 rounded-xl p-4 flex items-center justify-center h-28 transition-all duration-300 hover:-translate-y-1.5 cursor-pointer shadow-lg hover:shadow-[0_0_20px_rgba(245,158,11,0.25)]">
            <img id="img-${i}" src="${logo.src}" alt="${logo.title}" class="max-h-12 max-w-[85%] object-contain filter contrast-125 brightness-110 group-hover:scale-105 transition-all duration-200">
        </div>
      `;
      gridContainer.insertAdjacentHTML('beforeend', cardHTML);
    }
  }

  // Fast Logo Swap Function (800ms Interval)
  function startFastLogoSwap() {
    setInterval(() => {
      // Pick 2 random slots at once for rapid feel
      for(let step = 0; step < 2; step++) {
        const randomSlot = Math.floor(Math.random() * cardCount);
        const randomLogo = logosList[Math.floor(Math.random() * logosList.length)];

        const card = document.getElementById(`card-${randomSlot}`);
        const img = document.getElementById(`img-${randomSlot}`);

        if (card && img) {
          card.classList.add('flash-active');

          setTimeout(() => {
            img.src = randomLogo.src;
            img.alt = randomLogo.title;
          }, 120);

          setTimeout(() => {
            card.classList.remove('flash-active');
          }, 250);
        }
      }
    }, 800); // Badly fast: Har 0.8s mein logos dynamically shift honge
  }

  document.addEventListener("DOMContentLoaded", () => {
    initGrid();
    startFastLogoSwap();
  });
</script>
