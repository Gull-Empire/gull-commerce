          <span class="text-xs font-extrabold text-slate-900/80 uppercase tracking-wider block pt-1">

<!-- NUMBER COUNTING ANIMATION SCRIPT -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const counters = document.querySelectorAll('.counter');
    const speed = 40; // Lower number = faster counting

    const startCounting = (entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const counter = entry.target;
          const updateCount = () => {
            const target = +counter.getAttribute('data-target');
            const count = +counter.innerText;
            const inc = Math.ceil(target / speed);

            if (count < target) {
              counter.innerText = count + inc > target ? target : count + inc;
              setTimeout(updateCount, 30);
            } else {
              counter.innerText = target;
            }
          };
          updateCount();
          observer.unobserve(counter);
        }
      });
    };

    const observer = new IntersectionObserver(startCounting, { threshold: 0.5 });
    counters.forEach(counter => observer.observe(counter));
  });
</script>
