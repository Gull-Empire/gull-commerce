<style>
  *{box-sizing:border-box;}
  body{background:#07070a;}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:#3a3a40;border-radius:10px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* Marketplace pills */
  .mp-btn{position:relative;transition:all .25s cubic-bezier(.2,.8,.2,1);}
  .mp-btn:hover{transform:translateY(-2px);border-color:rgba(245,158,11,.45);}
  .mp-btn.active{background:linear-gradient(135deg,#fbbf24,#ea580c);color:#0a0a0a;border-color:transparent;
    box-shadow:0 10px 30px -8px rgba(245,158,11,.55), inset 0 1px 0 rgba(255,255,255,.35);
    transform:translateY(-2px);}
  .mp-btn.active .mp-icon{color:#0a0a0a;}
  .mp-btn:not(.active) .mp-icon{color:#f59e0b;}

  /* Seller / Vendor switch */
  .mode-tab{transition:all .25s ease;}
  .mode-tab.active{background:linear-gradient(135deg,#fbbf24,#ea580c);color:#0a0a0a;
    box-shadow:0 6px 20px -6px rgba(245,158,11,.55);}

  /* Topic buttons */
  .topic-btn{position:relative;transition:all .2s ease;}
  .topic-btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;
    background:transparent;transition:background .2s ease;}
  .topic-btn:hover::before{background:rgba(245,158,11,.35);}
  .topic-btn.active{background:linear-gradient(90deg,rgba(245,158,11,.16),rgba(245,158,11,.02));color:#fff;}
  .topic-btn.active::before{background:linear-gradient(180deg,#fbbf24,#ea580c);}
  .topic-btn.active .topic-num{color:#f59e0b;}

  /* Content card */
  .content-card{background:
      radial-gradient(120% 140% at 100% 0%, rgba(245,158,11,.10), transparent 55%),
      linear-gradient(180deg,#12121a 0%, #0a0a0f 100%);
    border:1px solid rgba(255,255,255,.06);
    box-shadow:0 30px 60px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.04);
  }

  .feature-chip{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);transition:all .2s ease;}
  .feature-chip:hover{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.05);transform:translateX(2px);}
  .feature-chip .tick{background:rgba(245,158,11,.12);}

  .icon-badge{background:linear-gradient(145deg,#1c1c24,#0f0f14);border:1px solid rgba(255,255,255,.08);

  .cta-btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px -8px rgba(245,158,11,.65);}

  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
let activeMarketplace = "amazon";
let activeAmazonMode = "seller";
let activeTopicIndex = 0;

function currentServices(){
  const mp = MARKETPLACES[activeMarketplace];
  return mp.hasModes ? mp.modes[activeAmazonMode].services : mp.services;
}
function currentLabel(){
  const mp = MARKETPLACES[activeMarketplace];
  return mp.hasModes ? `${mp.label} · ${mp.modes[activeAmazonMode].label}` : mp.label;
}

/* ---------------------------------------------------------
   RENDER: marketplace selector
--------------------------------------------------------- */
function renderMarketplaceRow(){
  const row = document.getElementById("marketplace-row");
  row.innerHTML = Object.keys(MARKETPLACES).map(key => {
    const mp = MARKETPLACES[key];
    const isActive = key === activeMarketplace;
    return `
      <button onclick="selectMarketplace('${key}')"
        class="mp-btn ${isActive ? 'active' : ''} flex items-center gap-2.5 shrink-0 px-5 py-3 rounded-2xl border border-slate-800 bg-slate-900/70 text-slate-300 font-bold text-sm hover:text-white">
        <i class="mp-icon ${mp.icon} text-base"></i>
        <span>${mp.label}</span>
      </button>`;
  }).join("");
}

/* ---------------------------------------------------------
   RENDER: Amazon Seller/Vendor switch
--------------------------------------------------------- */
function renderAmazonModeRow(){
  const wrap = document.getElementById("amazon-mode-row");
  const mp = MARKETPLACES.amazon;
  if (activeMarketplace !== "amazon" || !mp.hasModes){
    wrap.innerHTML = "";
    return;
  }
  wrap.innerHTML = `
    <div class="inline-flex bg-slate-900/90 border border-slate-800 p-1.5 rounded-2xl shadow-2xl backdrop-blur-xl">
      ${Object.keys(mp.modes).map(modeKey => {
        const isActive = modeKey === activeAmazonMode;
        return `
          <button onclick="selectAmazonMode('${modeKey}')"
            class="mode-tab ${isActive ? 'active' : 'text-slate-400 hover:text-white'} px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest">
            ${mp.modes[modeKey].label}
          </button>`;
      }).join("")}
    </div>`;
}

/* ---------------------------------------------------------
   RENDER: topic sidebar
--------------------------------------------------------- */
function renderTopicList(){
  const list = document.getElementById("topic-list");
  const services = currentServices();
  document.getElementById("topic-count").textContent = `${services.length} topics`;
  list.innerHTML = services.map((s, i) => {
    const isActive = i === activeTopicIndex;
    return `
      <button onclick="selectTopic(${i})"
        class="topic-btn ${isActive ? 'active' : ''} shrink-0 lg:w-full text-left flex items-center gap-3 pl-5 pr-4 py-3.5 rounded-xl lg:rounded-lg text-slate-400 font-semibold text-sm hover:text-white whitespace-nowrap lg:whitespace-normal">
        <span class="topic-num text-[11px] font-mono text-slate-600">${String(i+1).padStart(2,'0')}</span>
        <span>${s.title}</span>
      </button>`;
  }).join("");
}

  panel.innerHTML = `
    <div class="absolute -right-16 -top-16 w-56 h-56 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fade-in relative z-10">
      <div class="flex items-center gap-4 mb-6">
        <div class="icon-badge w-14 h-14 shrink-0 rounded-2xl flex items-center justify-center text-amber-500 text-xl">
          <i class="${s.icon}"></i>
        </div>
        <div>
          <span class="text-xs font-mono font-semibold text-amber-500/80 uppercase tracking-widest">${currentLabel()} &middot; Service Breakdown</span>
          <h3 class="text-2xl sm:text-3xl font-bold text-white tracking-wide mt-1">${s.title}</h3>
        </div>
      </div>

      <p class="text-slate-400 text-base leading-relaxed mb-8 max-w-2xl">${s.desc}</p>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8">
        ${s.features.map(f => `
          <div class="feature-chip flex items-center gap-3 rounded-xl px-4 py-3">
            <span class="tick w-5 h-5 rounded-full flex items-center justify-center shrink-0">
              <i class="fa-solid fa-check text-amber-500 text-[10px]"></i>
            </span>
            <span class="text-slate-300 text-sm">${f}</span>
          </div>`).join("")}
      </div>

      <a href="#contact" class="cta-btn inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-black px-6 py-3.5 rounded-xl">
        <span>Get This For My Brand</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </a>
    </div>`;
}

/* ---------------------------------------------------------
   EVENT HANDLERS
--------------------------------------------------------- */
function selectMarketplace(key){
  activeMarketplace = key;
  activeAmazonMode = "seller";
  activeTopicIndex = 0;
  renderMarketplaceRow();
  renderAmazonModeRow();
  renderTopicList();
  renderContent();
}

function selectAmazonMode(modeKey){
  activeAmazonMode = modeKey;
  activeTopicIndex = 0;
  renderAmazonModeRow();
  renderTopicList();
  renderContent();
}

function selectTopic(index){
  activeTopicIndex = index;
  renderTopicList();
  renderContent();
}

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
renderMarketplaceRow();
renderAmazonModeRow();
renderTopicList();
renderContent();
</script>
