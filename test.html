/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
let activeMarketplace = "amazon";
let activeTopicIndex = 0;

/* ---------------------------------------------------------
   RENDER: marketplace selector
--------------------------------------------------------- */
function renderMarketplaceRow(){
  const row = document.getElementById("marketplace-row");
  row.innerHTML = Object.keys(MARKETPLACES).map(key => {
    const mp = MARKETPLACES[key];
    const isActive = key === activeMarketplace;
    return `
      <button
        onclick="selectMarketplace('${key}')"
        class="mp-btn ${isActive ? 'active' : ''} flex items-center gap-2.5 shrink-0 px-5 py-3 rounded-2xl border border-slate-800 bg-slate-900/70 text-slate-300 font-bold text-sm hover:border-amber-500/40 hover:text-white transition-all duration-200"
      >
        <i class="mp-icon ${mp.icon} text-base ${isActive ? '' : 'text-amber-500'}"></i>
        <span>${mp.label}</span>
      </button>
    `;
  }).join("");
}

/* ---------------------------------------------------------
   RENDER: topic sidebar for active marketplace
--------------------------------------------------------- */
function renderTopicList(){
  const list = document.getElementById("topic-list");
  const services = MARKETPLACES[activeMarketplace].services;
  list.innerHTML = services.map((s, i) => {
    const isActive = i === activeTopicIndex;
    return `
      <button
        onclick="selectTopic(${i})"
        class="topic-btn ${isActive ? 'active' : ''} shrink-0 lg:w-full text-left flex items-center gap-3 px-4 py-3.5 rounded-xl lg:rounded-lg border-l-2 border-transparent text-slate-400 font-semibold text-sm hover:text-white hover:bg-white/5 transition-all duration-150 whitespace-nowrap lg:whitespace-normal"
      >
        <span class="topic-num text-[11px] font-mono text-slate-600">${String(i+1).padStart(2,'0')}</span>
        <span>${s.title}</span>
      </button>
    `;
  }).join("");
}

/* ---------------------------------------------------------
   RENDER: content panel
--------------------------------------------------------- */
function renderContent(){
  const panel = document.getElementById("content-panel");
  const mp = MARKETPLACES[activeMarketplace];
  const s = mp.services[activeTopicIndex];

  panel.innerHTML = `
    <div class="fade-in relative z-10">
      <div class="flex items-start justify-between gap-6 mb-6">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 shrink-0 rounded-2xl bg-slate-800/80 border border-slate-700/80 flex items-center justify-center text-amber-500 text-xl shadow-inner">
            <i class="${s.icon}"></i>
          </div>
          <div>
            <span class="text-xs font-mono font-semibold text-amber-500/80 uppercase tracking-widest">${mp.label} &middot; Service Breakdown</span>
            <h3 class="text-2xl sm:text-3xl font-bold text-white tracking-wide mt-1">${s.title}</h3>
          </div>
        </div>
      </div>

      <p class="text-slate-400 text-base leading-relaxed mb-8 max-w-2xl">${s.desc}</p>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8">
        ${s.features.map(f => `
          <div class="flex items-center gap-3 bg-black/30 border border-slate-800 rounded-xl px-4 py-3">
            <i class="fa-solid fa-check text-amber-500 text-xs"></i>
            <span class="text-slate-300 text-sm">${f}</span>
          </div>
        `).join("")}
      </div>

      <a href="#contact" class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-black bg-gradient-to-r from-amber-500 to-orange-600 px-6 py-3.5 rounded-xl hover:shadow-lg hover:shadow-amber-500/25 transition-all duration-200">
        <span>Get This For My Brand</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </a>
    </div>
  `;
}

/* ---------------------------------------------------------
   EVENT HANDLERS
--------------------------------------------------------- */
function selectMarketplace(key){
  activeMarketplace = key;
  activeTopicIndex = 0;
  renderMarketplaceRow();
  renderTopicList();
  renderContent();
}

function selectTopic(index){
  activeTopicIndex = index;
  renderTopicList();
  renderContent();
}

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
renderMarketplaceRow();
renderTopicList();
renderContent();
</script>
