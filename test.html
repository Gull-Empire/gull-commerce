<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Feedback - Gull Empire</title>

  <!-- TAILWIND CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
   <!-- ========================================== -->
<!-- GULL EMPIRE - PREMIUM RESULTS & VERIFIED REVIEWS SECTION -->
<section class="w-full bg-[#030304] text-slate-100 py-16 px-4 sm:px-6 lg:px-8 font-sans">
  <div class="max-w-6xl mx-auto shadow-2xl rounded-3xl overflow-hidden border border-orange-500/30 bg-[#0a0a0e]">
    
    <!-- TOP SECTION: AMAZON ORANGE GRADIENT BANNER -->
    <div class="bg-gradient-to-r from-orange-600 via-amber-500 to-orange-500 text-slate-950 p-8 sm:p-12 text-center relative overflow-hidden">
      <!-- Subtle Ambient Texture Overlay -->
      <div class="absolute inset-0 opacity-15 bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>

      <!-- Header Content -->
      <div class="relative z-10 space-y-2.5 max-w-2xl mx-auto mb-10">
        <h2 class="text-3xl sm:text-4xl font-black tracking-tight text-slate-950 uppercase">
          It’s All About Results
        </h2>
        <p class="text-xs sm:text-sm font-bold text-slate-950/80 leading-relaxed">
          Our success is directly tied to the growth and global expansion of our client portfolio.
        </p>
      </div>

      <!-- METRICS GRID -->
      <div class="relative z-10 grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-4 items-center divide-y md:divide-y-0 md:divide-x divide-slate-950/20 pt-2">
        
        <!-- Metric 1 -->
        <div class="space-y-1 pt-4 md:pt-0">
          <span class="text-4xl sm:text-5xl font-black tracking-tight text-slate-950 block">70+</span>
          <span class="text-[11px] font-extrabold text-slate-950 uppercase tracking-widest block">Brands Currently Managed</span>
        </div>

        <!-- Metric 2 (Featured Hero Metric) -->
        <div class="space-y-1 pt-4 md:pt-0">
          <span class="text-4xl sm:text-5xl font-black tracking-tight text-slate-950 block">$15M+</span>
          <span class="text-[11px] font-extrabold text-slate-950 uppercase tracking-widest block">Revenue Generated on Amazon</span>
        </div>

        <!-- Metric 3 -->
        <div class="space-y-1 pt-4 md:pt-0">
          <span class="text-4xl sm:text-5xl font-black tracking-tight text-slate-950 block">98%</span>
          <span class="text-[11px] font-extrabold text-slate-950 uppercase tracking-widest block">Client Retention Rate</span>
        </div>

      </div>
    </div>

    <!-- TRIANGLE POINTER -->
    <div class="relative flex justify-center bg-[#0d0d12]">
      <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[14px] border-t-amber-500 absolute -top-[1px]"></div>
    </div>

    <!-- BOTTOM SECTION: OFFICIAL REVIEWS & SOCIAL PROOF -->
    <div class="bg-[#0d0d12] px-6 py-8 sm:py-10 border-t border-slate-800/80">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center max-w-4xl mx-auto">
        
        <!-- OFFICIAL TRUSTPILOT BADGE CARD -->
        <div class="bg-[#121218]/90 border border-slate-800 rounded-2xl p-5 flex items-center justify-between transition-all duration-300 hover:border-emerald-500/40 hover:shadow-lg hover:shadow-emerald-500/5">
          <!-- Official Trustpilot Logo -->
          <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-lg bg-[#00b67a]/15 flex items-center justify-center text-[#00b67a]">
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path d="M12 0l3.09 9.511h10l-8.09 5.882 3.09 9.511-8.09-5.882-8.09 5.882 3.09-9.511-8.09-5.882h10z"/>
              </svg>
            </div>
            <span class="text-lg font-bold text-white tracking-tight">Trustpilot</span>
          </div>
          
          <!-- Rating Stars & Text -->
          <div class="text-right">
            <div class="flex items-center justify-end space-x-1 text-[#00b67a]">
              <span class="text-sm">★</span>
              <span class="text-sm">★</span>
              <span class="text-sm">★</span>
              <span class="text-sm">★</span>
              <span class="text-sm">★</span>
            </div>
            <span class="text-[11px] font-semibold text-slate-400 block mt-1">4.9 Stars • 470 Reviews</span>
          </div>
        </div>

        <!-- OFFICIAL GOOGLE REVIEWS BADGE CARD -->
        <div class="bg-[#121218]/90 border border-slate-800 rounded-2xl p-5 flex items-center justify-between transition-all duration-300 hover:border-orange-500/40 hover:shadow-lg hover:shadow-orange-500/5">
          <!-- Official Google Logo -->
          <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center border border-slate-800">
              <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
            </div>
            <span class="text-lg font-bold text-white tracking-tight">Google</span>
          </div>

          <!-- Rating Stars & Text -->
          <div class="text-right">
            <div class="flex items-center justify-end space-x-1 text-amber-400">
              <span class="text-sm">★</span>
              <span class="text-sm">★</span>
              <span class="text-sm">★</span>
              <span class="text-sm">★</span>
              <span class="text-sm">★</span>
            </div>
            <span class="text-[11px] font-semibold text-slate-400 block mt-1">5.0 Stars • Verified Agency</span>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
