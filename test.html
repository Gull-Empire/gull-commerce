<style>
  /* Metallic Light-Sweep (Bling) Effect */
  @keyframes blingSweep {
    0% {
      transform: translateX(-150%) skewX(-25deg);
    }
    20%, 100% {
      transform: translateX(250%) skewX(-25deg);
    }
  }

  .bling-card {
    position: relative;
    overflow: hidden;
  }

  .bling-card::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      60deg,
      transparent 30%,
      rgba(255, 255, 255, 0.25) 50%,
      rgba(245, 158, 11, 0.4) 55%,
      transparent 70%
    );
    animation: blingSweep 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events-none: none;
  }

  /* Staggering the animation for each card so they don't bling all at once */
  .bling-card:nth-child(2n)::after { animation-delay: 0.7s; }
  .bling-card:nth-child(3n)::after { animation-delay: 1.4s; }
  .bling-card:nth-child(4n)::after { animation-delay: 2.1s; }
  .bling-card:nth-child(5n)::after { animation-delay: 2.8s; }

  /* Glow pulse on hover */
  .bling-card:hover {
    box-shadow: 0 0 25px rgba(245, 158, 11, 0.4), inset 0 0 15px rgba(245, 158, 11, 0.2);
  }
</style>
