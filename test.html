<!-- ULTRA-PREMIUM DESIGNED LOGO CARDS SECTION -->
<style>
  /* Continuous Sheen / Metallic Sweep Effect */
  @keyframes metallicSweep {
    0% { transform: translateX(-150%) skewX(-25deg); }
    30%, 100% { transform: translateX(250%) skewX(-25deg); }
  }

  /* Rapid Swap Flash Animation */
  @keyframes cardFlash {
    0%, 100% { opacity: 1; filter: brightness(1.2); }
    50% { opacity: 0.2; filter: brightness(0.3) blur(2px); }
  }

  .premium-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, #121214 0%, #08080a 100%);
  }

  /* Shiny Sweep Line */
  .premium-card::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      60deg,
      transparent 35%,
      rgba(255, 255, 255, 0.12) 48%,
      rgba(245, 158, 11, 0.4) 52%,
      transparent 65%
    );
    animation: metallicSweep 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }

  .premium-card:nth-child(2n)::after { animation-delay: 0.4s; }
  .premium-card:nth-child(3n)::after { animation-delay: 0.8s; }
  .premium-card:nth-child(4n)::after { animation-delay: 1.2s; }

  .flash-active {
    animation: cardFlash 0.25s ease-in-out;
  }
</style>

<section class="relative w-full bg-[#030303] text-slate-100 py-20 px-4 sm:px-8 lg:px-12 overflow-hidden font-sans border-t border-amber-500/20">
    
    <!-- Background Soft Amber Aura -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] h-[450px] bg-amber-500/10 rounded-full blur-[180px] pointer-events-none"></div>

    <div class="relative z-10 max-w-[95rem] mx-auto space-y-12">
        
        <!-- Header Section -->
        <div class="text-center space-y-3 max-w-3xl mx-auto">
            <div class="inline-flex items-center space-x-2 text-xs font-black uppercase tracking-widest text-amber-400 bg-amber-500/10 px-5 py-2 rounded-full border border-amber-500/30 backdrop-blur-md shadow-[0_0_15px_rgba(245,158,11,0.2)]">

            <h2 class="text-3xl sm:text-5xl font-black text-white tracking-tight">
                Platforms & Tools <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-400 to-yellow-300 drop-shadow-[0_0_25px_rgba(245,158,11,0.4)]">I Work With</span>
            </h2>
            <p class="text-xs sm:text-sm text-slate-400 max-w-xl mx-auto leading-relaxed">
                Empowering brands across top-tier <span class="text-amber-400 font-semibold">E-Commerce Marketplaces</span>, <span class="text-orange-400 font-semibold">Data Analytics Engines</span>, and <span class="text-yellow-400 font-semibold">Advertising Channels</span>.
            </p>
        </div>

        <!-- HIGH-DESIGNED LOGO GRID -->
        <div id="logo-grid-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-5 lg:gap-6">
            <!-- JavaScript dynamically injects stylized boxes here -->
        </div>

    </div>
</section>

<script>
  const logosList = [
    { src: "https://abdullah-gull.github.io/images/Amazon-Seller-Service-1024x500.png", title: "Amazon Seller Central" },
    { src: "https://abdullah-gull.github.io/images/Shopify-Logo.jpg", title: "Shopify" },
    { src: "https://abdullah-gull.github.io/images/walmart-logo-png-5.png", title: "Walmart" },
    { src: "https://abdullah-gull.github.io/images/Etsy_logo.svg.webp", title: "Etsy" },
    { src: "https://abdullah-gull.github.io/images/EBay_logo.png", title: "eBay" },
    { src: "https://abdullah-gull.github.io/images/6752c0a021fd1f672842c767_CPSecEh24I1i34_8eYced5Ig3NFthwrRw6bQQOMHdOg.png", title: "Helium 10" },
    { src: "https://abdullah-gull.github.io/images/images.jpg", title: "Amazon Vendor Central" },
    { src: "https://abdullah-gull.github.io/images/meta-facebook-rebranding-name-news_dezeen_2364_col_hero2.jpg", title: "Meta Ads" },
    { src: "https://abdullah-gull.github.io/images/jungle-scout-affiliate-program.jpg", title: "Jungle Scout" },
    { src: "https://abdullah-gull.github.io/images/OG_image_Squid_Ink.png", title: "Amazon Ads" }
  ];

  const gridContainer = document.getElementById('logo-grid-container');
  const cardCount = 12;

  // Initialize Custom Designed Cards
  function initGrid() {
    gridContainer.innerHTML = '';
    for (let i = 0; i < cardCount; i++) {
      const logo = logosList[i % logosList.length];
      const cardHTML = `
        <div id="card-${i}" class="premium-card group relative border border-white/10 hover:border-amber-400/80 rounded-2xl p-5 flex flex-col items-center justify-center h-36 sm:h-40 transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_10px_30px_rgba(245,158,11,0.25)] cursor-pointer">
            
            <!-- Top Golden Accent Line -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/2 h-[2px] bg-gradient-to-r from-transparent via-amber-400/80 to-transparent group-hover:w-4/5 transition-all duration-500"></div>

            <!-- Top Corner Glow Indicator Dot -->
            <div class="absolute top-3 right-3 w-1.5 h-1.5 rounded-full bg-amber-500/40 group-hover:bg-amber-400 group-hover:shadow-[0_0_8px_#f59e0b] transition-all duration-300"></div>

            <!-- Inner Soft Contrast Capsule -->
            <div class="w-full h-full bg-black/40 backdrop-blur-md rounded-xl p-3 flex items-center justify-center border border-white/5 group-hover:border-amber-500/20 transition-all duration-300">
                <img id="img-${i}" src="${logo.src}" alt="${logo.title}" class="max-h-14 max-w-[85%] object-contain filter contrast-125 brightness-110 group-hover:scale-110 transition-transform duration-300">
            </div>

            <!-- Bottom Subtle Hover Glow Bar -->
            <div class="absolute bottom-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-orange-500/0 group-hover:via-orange-500/60 to-transparent transition-all duration-500"></div>
        </div>
      `;
      gridContainer.insertAdjacentHTML('beforeend', cardHTML);
    }
  }

  // Fast Logo Swapping (800ms)
  function startFastLogoSwap() {
    setInterval(() => {
      for(let step = 0; step < 2; step++) {
        const randomSlot = Math.floor(Math.random() * cardCount);
        const randomLogo = logosList[Math.floor(Math.random() * logosList.length)];

        const card = document.getElementById(`card-${randomSlot}`);
        const img = document.getElementById(`img-${randomSlot}`);

        if (card && img) {
          card.classList.add('flash-active');

          setTimeout(() => {
            img.src = randomLogo.src;
            img.alt = randomLogo.title;
          }, 120);

          setTimeout(() => {
            card.classList.remove('flash-active');
          }, 250);
        }
      }
    }, 800);
  }

  document.addEventListener("DOMContentLoaded", () => {
    initGrid();
    startFastLogoSwap();
  });
</script>
