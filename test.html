<!-- ULTRA-PREMIUM DYNAMIC LOGO SWAPPER WITH BLING & FLICKER EFFECT -->
<style>
  /* Metallic Light-Sweep (Bling) Effect */
  @keyframes blingSweep {
    0% { transform: translateX(-150%) skewX(-25deg); }
    25%, 100% { transform: translateX(250%) skewX(-25deg); }
  }

  /* Neon Light Switch ON/OFF Flicker Animation */
  @keyframes neonFlicker {
    0%, 100% { opacity: 1; filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.6)); }
    20% { opacity: 0.2; filter: none; }
    25% { opacity: 1; filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.9)); }
    40% { opacity: 0.4; }
    42% { opacity: 1; }
  }

  .bling-card {
    position: relative;
    overflow: hidden;
  }

  .bling-card::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      60deg,
      transparent 30%,
      rgba(255, 255, 255, 0.35) 50%,
      rgba(245, 158, 11, 0.5) 55%,
      transparent 70%
    );
    animation: blingSweep 3.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }

  /* Different delays for natural bling flow */
  .bling-card:nth-child(2n)::after { animation-delay: 0.5s; }
  .bling-card:nth-child(3n)::after { animation-delay: 1.2s; }
  .bling-card:nth-child(4n)::after { animation-delay: 1.8s; }
  .bling-card:nth-child(5n)::after { animation-delay: 2.5s; }

  .flicker-active {
    animation: neonFlicker 0.4s ease-in-out;
  }
</style>

<!-- JAVASCRIPT FOR REAL-TIME LOGO SWAPPING & FLICKER EFFECT -->
<script>
  // List of all your logo images
  const logosList = [
    { src: "https://abdullah-gull.github.io/images/Amazon-Seller-Service-1024x500.png", title: "Amazon Seller Central" },
    { src: "https://abdullah-gull.github.io/images/Shopify-Logo.jpg", title: "Shopify" },
    { src: "https://abdullah-gull.github.io/images/walmart-logo-png-5.png", title: "Walmart" },
    { src: "https://abdullah-gull.github.io/images/Etsy_logo.svg.webp", title: "Etsy" },
    { src: "https://abdullah-gull.github.io/images/EBay_logo.png", title: "eBay" },
    { src: "https://abdullahgull.github.io/images/6752c0a021fd1f672842c767_CPSecEh24I1i34_8eYced5Ig3NFthwrRw6bQQOMHdOg.png", title: "Helium 10" },
    { src: "https://abdullah-gull.github.io/images/images.jpg", title: "Amazon Vendor Central" },
    { src: "https://abdullah-gull.github.io/images/meta-facebook-rebranding-name-news_dezeen_2364_col_hero2.jpg", title: "Meta Ads" },
    { src: "https://abdullah-gull.github.io/images/jungle-scout-affiliate-program.jpg", title: "Jungle Scout" },
    { src: "https://abdullah-gull.github.io/images/OG_image_Squid_Ink.png", title: "Amazon Ads" }
  ];

  const gridContainer = document.getElementById('logo-grid-container');
  const cardCount = 12; // Grid has 12 slots

  // Initial Render of Cards
  function initGrid() {
    gridContainer.innerHTML = '';
    for (let i = 0; i < cardCount; i++) {
      const logo = logosList[i % logosList.length];
      const cardHTML = `
        <div id="card-${i}" class="bling-card group relative bg-[#0d071a]/80 backdrop-blur-md border border-purple-500/30 hover:border-amber-400 rounded-2xl p-4 flex items-center justify-center h-28 transition-all duration-500 hover:-translate-y-2 cursor-pointer shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
            <img id="img-${i}" src="${logo.src}" alt="${logo.title}" class="max-h-12 max-w-[85%] object-contain filter contrast-125 brightness-110 group-hover:scale-110 transition-all duration-300">
        </div>
      `;
      gridContainer.insertAdjacentHTML('beforeend', cardHTML);
    }
  }

  // Random Logo Swap with Light Off/On Flicker
  function startDynamicLogoSwap() {
    setInterval(() => {
      // Pick a random slot to swap
      const randomSlot = Math.floor(Math.random() * cardCount);
      const randomLogo = logosList[Math.floor(Math.random() * logosList.length)];

      const card = document.getElementById(`card-${randomSlot}`);
      const img = document.getElementById(`img-${randomSlot}`);

      if (card && img) {
        // Step 1: Trigger Light Flicker Animation
        card.classList.add('flicker-active');

        setTimeout(() => {
          // Step 2: Swap Image Source halfway through flicker
          img.src = randomLogo.src;
          img.alt = randomLogo.title;
        }, 200);

        setTimeout(() => {
          // Step 3: Remove animation class for next cycle
          card.classList.remove('flicker-active');
        }, 450);
      }
    }, 2000); // Swaps every 2 seconds
  }

  // Run on Load
  document.addEventListener("DOMContentLoaded", () => {
    initGrid();
    startDynamicLogoSwap();
  });
</script>
