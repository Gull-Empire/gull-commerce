<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Feedback - Gull Empire</title>

  <!-- TAILWIND CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
   <!-- ========================================== -->
 <!-- GULL EMPIRE - RESULTS & SOCIAL PROOF SECTION -->
<section class="w-full bg-[#030304] text-slate-100 py-16 px-4 sm:px-6 lg:px-8 font-sans">
  <div class="max-w-6xl mx-auto shadow-2xl rounded-3xl overflow-hidden border border-amber-500/20 bg-[#0a0a0e]">
    
    <!-- TOP SECTION: GOLD / AMBER BANNER WITH CORE METRICS -->
    <div class="bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 text-slate-950 p-8 sm:p-12 text-center relative overflow-hidden">
      <!-- Subtle Pattern Overlay -->
      <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>

      <div class="relative z-10 space-y-3 max-w-2xl mx-auto mb-10">
        <h2 class="text-2xl sm:text-3xl font-black tracking-tight text-slate-950">
          It’s All About Results
        </h2>
        <p class="text-xs sm:text-sm font-semibold text-slate-900/80 leading-relaxed">
          Our success is directly tied to the growth and global expansion of our client portfolio.
        </p>
      </div>

      <!-- METRICS GRID -->
      <div class="relative z-10 grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-4 items-center divide-y md:divide-y-0 md:divide-x divide-slate-950/15 pt-2">
        
        <!-- Metric 1 -->
        <div class="space-y-1 pt-4 md:pt-0">
          <span class="text-4xl sm:text-5xl font-black tracking-tight text-slate-950 block">70+</span>
          <span class="text-xs font-bold text-slate-900/90 uppercase tracking-wider block">Brands Currently Managed</span>
        </div>

        <!-- Metric 2 (Highlight) -->
        <div class="space-y-1 pt-4 md:pt-0">
          <span class="text-4xl sm:text-5xl font-black tracking-tight text-slate-950 block">$15M+</span>
          <span class="text-xs font-bold text-slate-900/90 uppercase tracking-wider block">Revenue Generated on Amazon</span>
        </div>

        <!-- Metric 3 -->
        <div class="space-y-1 pt-4 md:pt-0">
          <span class="text-4xl sm:text-5xl font-black tracking-tight text-slate-950 block">98%</span>
          <span class="text-xs font-bold text-slate-900/90 uppercase tracking-wider block">Client Retention Rate</span>
        </div>

      </div>
    </div>

    <!-- LITTLE POINTER TRIANGLE -->
    <div class="relative flex justify-center bg-[#0d0d12]">
      <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[12px] border-t-amber-400 absolute -top-[1px]"></div>
    </div>

    <!-- BOTTOM SECTION: DARK SOCIAL PROOF (TRUSTPILOT & GOOGLE) -->
    <div class="bg-[#0d0d12] px-6 py-8 sm:py-10 border-t border-slate-800/80">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center max-w-4xl mx-auto">
        
        <!-- Trustpilot Rating -->
        <div class="flex flex-col sm:flex-row items-center justify-center space-y-3 sm:space-y-0 sm:space-x-4 border-b md:border-b-0 md:border-r border-slate-800 pb-6 md:pb-0 md:pr-6">
          <div class="flex items-center space-x-2 text-emerald-400">
            <!-- Trustpilot Star Icon -->
            <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24">
              <path d="M12 0l3.09 9.511h10l-8.09 5.882 3.09 9.511-8.09-5.882-8.09 5.882 3.09-9.511-8.09-5.882h10z"/>
            </svg>
            <span class="text-xl font-extrabold text-white tracking-tight">Trustpilot</span>
          </div>
          <div class="text-center sm:text-left">
            <div class="flex items-center justify-center sm:justify-start space-x-1 text-emerald-400">
              <span class="text-sm font-bold">★ ★ ★ ★ ★</span>
            </div>
            <span class="text-xs font-semibold text-slate-400 block mt-0.5">4.9 Stars • Excellent Reviews</span>
          </div>
        </div>

        <!-- Google Reviews -->
        <div class="flex flex-col sm:flex-row items-center justify-center space-y-3 sm:space-y-0 sm:space-x-4">
          <div class="flex items-center space-x-2">
            <!-- Google Logo Colors SVG -->
            <svg class="w-6 h-6" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="text-xl font-bold text-white tracking-tight">Google</span>
          </div>
          <div class="text-center sm:text-left">
            <div class="flex items-center justify-center sm:justify-start space-x-1 text-amber-400">
              <span class="text-sm font-bold">★ ★ ★ ★ ★</span>
            </div>
            <span class="text-xs font-semibold text-slate-400 block mt-0.5">5.0 Stars • Verified Agency</span>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
